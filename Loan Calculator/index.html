<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Loan Calculator</h1>

        <p>Loan Amount $
            <input onchange="calculateLoan()" type="number" class="input" name="" id="loan-amount" min="1" max="500000" value="10000">
        </p>

        <p>Interest Rate %
            <input onchange="calculateLoan()" type="number" class="input" name="" id="interest-rate" min="0" max="100" step=".1" value="10">
        </p>

        <p>Months to pay
            <input onchange="calculateLoan()" type="number" class="input" name="" id="months-to-pay" min="6" max="48" value="12">
        </p>

        <p class="payment" id="payment">Monthly Payment :</p>
    </div>


    <script src="index.js"></script>
</body>
</html>
