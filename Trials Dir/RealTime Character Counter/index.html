<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <div class="counter-container">
        <h4>Character Counter</h4>
        <textarea name="" id="textarea" class="textarea" placeholder="Write your text here...." maxlength="50"></textarea>

        <div class="counter">
            <p>Total Characters: <span class="total-characters" id="total-characters"></span></p>
            <p>Remaining Characters: <span class="remaining-characters" id="remaining-characters"></span></p>
        </div>
    </div>


    <script src="index.js"></script>
</body>
</html>
