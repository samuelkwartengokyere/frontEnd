<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Hub Africa | Campaign Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

    <div id="toast-container"></div>

    <main class="app-container">
        <header class="app-header">
            <div class="header-brand">
                <div class="logo">
                    <img src="assets/tha-logo.png" alt="Tech Hub Africa">
                </div>
                <h1>Campaign Studio</h1>
            </div>
            <nav class="app-nav" data-app-nav="campaign"></nav>
        </header>

        <div class="glass-card">
            <form id="emailForm">
                <div class="form-section">
                    <label for="fromName" class="form-label">Sender name</label>
                    <input type="text" id="fromName" class="modern-input" placeholder="e.g. Tech Hub Africa" required>
                </div>

                <div class="form-section">
                    <label for="fromEmail" class="form-label">From email (sending mailbox)</label>
                    <input type="email" id="fromEmail" class="modern-input" placeholder="e.g. events@techhubafrica.org" required>
                    <!-- <p class="field-hint">Changing this box is not enough until EmailJS From Email is <code>{{from_email}}</code> and <em>Use Default Email Address</em> is unchecked. Otherwise every message still shows as events@techhubafrica.org.</p> -->
                </div>

                <div class="form-section">
                    <label for="senderEmail" class="form-label">Reply-To email</label>
                    <input type="email" id="senderEmail" class="modern-input" placeholder="e.g. events@techhubafrica.org" required>
                    <p class="field-hint">Replies go here. This can differ from From.</p>
                </div>

                <!-- <div class="notice-card">
                    <strong>If Gmail never shows the mail:</strong> EmailJS History already said OK, so this app is not blocking delivery. Check cPanel Track Delivery, enable SPF/DKIM, then search Gmail for <code>from:techhubafrica.org</code>. Gmail often drops mail from new cPanel IPs instead of placing it in Spam.
                </div> -->

                <div class="form-section">
                    <label for="eventSelect" class="form-label">Event audience</label>
                    <select id="eventSelect" class="modern-input">
                        <option value="">One-off list (not saved to an event)</option>
                    </select>
                    <!-- <p class="field-hint">Choose Hackathon, Startup Pitch, or another event to load that group. Manage lists on the <a href="events.html">Events</a> page. Each address in Recipients gets its own email.</p> -->
                </div>

                <div class="form-section">
                    <label class="form-label">
                        Recipients
                        <span class="badge" id="recipientCount">0 emails</span>
                    </label>
                    <p class="field-hint">Paste addresses or upload a file. If an event is selected, these people belong to that event.</p>

                    <div class="dropzone" id="dropzone">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p>Drag & drop a <strong>.csv</strong> or <strong>.txt</strong> file here</p>
                        <span>or</span>
                        <button type="button" class="btn-browse" id="browseBtn">Browse Files</button>
                        <input type="file" id="fileInput" accept=".csv,.txt,text/csv,text/plain" hidden>
                    </div>

                    <textarea id="recipients" class="modern-input" rows="4" placeholder="user1@example.com, user2@example.com" required></textarea>
                    <div class="row-actions tight-actions">
                        <button type="button" class="btn-secondary btn-small" id="savePeopleBtn">Save people to selected event</button>
                    </div>
                </div>

                <div class="form-section">
                    <label for="templateSelect" class="form-label">Message template</label>
                    <select id="templateSelect" class="modern-input">
                        <option value="">Write a new message</option>
                    </select>
                    <div class="row-actions tight-actions">
                        <button type="button" class="btn-secondary btn-small" id="applyTemplateBtn">Apply template</button>
                        <button type="button" class="btn-secondary btn-small" id="saveTemplateBtn">Save as template</button>
                        <button type="button" class="btn-secondary btn-small" id="updateTemplateBtn">Update template</button>
                        <button type="button" class="btn-secondary btn-small" id="downloadTemplateBtn">Download template</button>
                    </div>
                    <!-- <p class="field-hint">Templates are stored in this browser. Manage them on the <a href="templates.html">Templates</a> page. <code>{{event_name}}</code> becomes the selected event name.</p> -->
                </div>

                <div class="form-section">
                    <label for="subject" class="form-label">Subject Line</label>
                    <input type="text" id="subject" class="modern-input" placeholder="e.g., Join the Tech Guru Meetup 2026!" required>
                </div>

                <div class="form-section">
                    <label for="message" class="form-label">Message Body</label>
                    <textarea id="message" class="modern-input" rows="8" placeholder="Write your campaign message here..." required></textarea>
                    <div id="campaignLogoPreviewWrap" class="logo-preview-wrap hidden">
                        <img id="campaignLogoPreview" class="logo-preview" alt="Template logo preview">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="clearBtn">Clear All</button>
                    <button type="submit" class="btn-primary" id="sendBtn">
                        <span class="btn-text">Launch Campaign</span>
                        <span class="btn-loader hidden">
                            <svg class="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" /></svg>
                            Sending...
                        </span>
                    </button>
                </div>
            </form>

            <div id="progressSection" class="progress-section hidden">
                <div class="progress-header">
                    <span id="progressStatus">Initializing...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-stats">
                    <div class="stat success"><span id="statSuccess">0</span> Sent</div>
                    <div class="stat failed"><span id="statFailed">0</span> Failed</div>
                </div>
                <ul id="failedList" class="failed-list hidden"></ul>
            </div>
        </div>

        <footer class="app-footer">
            <p>Empowering Africa's tech ecosystem. Connect. Learn. Grow.</p>
        </footer>
    </main>

    <script src="config.js"></script>
    <script src="store.js"></script>
    <script src="ui.js"></script>
    <script src="index.js"></script>
</body>
</html>
